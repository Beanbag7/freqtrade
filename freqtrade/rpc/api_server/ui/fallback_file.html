<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freqtrade UI 未安装</title>
  <style>
    :root {
      --background: #F5F6F3;
      --card: #FCFDFC;
      --foreground: #17251E;
      --muted: #52645A;
      --primary: #245B47;
      --border: #DEE5DE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--background);
      color: var(--foreground);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans CJK SC", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      border-radius: 8px;
      background: var(--primary);
      color: #F4F7F4;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 24px;
      line-height: 32px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p { color: var(--muted); margin: 8px 0; }
    code {
      background: #ECEFE9;
      border-radius: 6px;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--foreground);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">F</div>
    <h1>Freqtrade UI 未安装</h1>
    <p>在仓库根目录执行以下命令构建并安装「雾白墨绿」界面:</p>
    <p><code>cd ui && npm install && npm run build</code></p>
    <p>构建产物会输出到 <code>freqtrade/rpc/api_server/ui/installed/</code>,<br>重启机器人后刷新本页即可。</p>
  </div>
</body>
</html>
